name: Fix profile post count and admin button

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor == 'baldbuffalo' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Apply profile fixes
        shell: python
        run: |
          from pathlib import Path

          profile = Path('Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt')
          text = profile.read_text(encoding='utf-8')

          if 'import androidx.compose.material.icons.filled.AdminPanelSettings' not in text:
              text = text.replace(
                  'import androidx.compose.material.icons.filled.AddAPhoto\n',
                  'import androidx.compose.material.icons.filled.AddAPhoto\nimport androidx.compose.material.icons.filled.AdminPanelSettings\n',
                  1,
              )

          text = text.replace(
              'fun ProfileScreen(vm: AppViewModel, onAboutClick: () -> Unit, onHelpClick: () -> Unit) {',
              'fun ProfileScreen(vm: AppViewModel, onAboutClick: () -> Unit, onHelpClick: () -> Unit, onAdminClick: () -> Unit) {'
          )
          text = text.replace(
              'StatItem(vm.posts.size.toString(), "Posts")',
              'StatItem(vm.posts.count { it.userId == vm.user?.userNumber }.toString(), "Posts")'
          )
          text = text.replace(
              'SettingsItem(Icons.Default.Pets, "My Posts", "${vm.posts.count { it.userId.toString() == vm.uid }} posts") { }',
              'SettingsItem(Icons.Default.Pets, "My Posts", "${vm.posts.count { it.userId == vm.user?.userNumber }} posts") { }'
          )

          old = '''SettingsItem(Icons.Default.Info, "About Pawsome", "Version 1.0.0", onAboutClick); HorizontalDivider(modifier = Modifier.padding(horizontal = 16.dp), color = MaterialTheme.colorScheme.outline.copy(alpha = 0.3f)); SettingsItem(Icons.AutoMirrored.Filled.Help, "Help & Support", "Get help or report issues", onHelpClick)'''
          new = '''SettingsItem(Icons.Default.Info, "About Pawsome", "Version 1.0.0", onAboutClick); HorizontalDivider(modifier = Modifier.padding(horizontal = 16.dp), color = MaterialTheme.colorScheme.outline.copy(alpha = 0.3f)); SettingsItem(Icons.AutoMirrored.Filled.Help, "Help & Support", "Get help or report issues", onHelpClick); if (vm.isAdmin) { HorizontalDivider(modifier = Modifier.padding(horizontal = 16.dp), color = MaterialTheme.colorScheme.outline.copy(alpha = 0.3f)); SettingsItem(Icons.Default.AdminPanelSettings, "Admin", "Manage Pawsome administration", onAdminClick) }'''
          text = text.replace(old, new)
          profile.write_text(text, encoding='utf-8')

          main = Path('Android/app/src/main/java/com/pawsome/app/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              'ProfileScreen(vm, { showAbout = true }, { showHelp = true })',
              'ProfileScreen(vm, { showAbout = true }, { showHelp = true }, { showAdmin = true })'
          )
          main.write_text(text, encoding='utf-8')

      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt' 'Android/app/src/main/java/com/pawsome/app/MainActivity.kt'
          git rm '.github/workflows/fix-profile-admin.yml'
          git commit -m 'Fix profile post count and admin button'
          git push origin HEAD:main
