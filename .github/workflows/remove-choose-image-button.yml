name: Remove Choose Image Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove Choose Image button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt')
          s = p.read_text()
          start = s.find('    OutlinedButton(\n        onClick = pickPhoto,')
          if start == -1:
              raise SystemExit('Choose Image button block not found')
          end = s.find('    OutlinedTextField(', start)
          if end == -1:
              raise SystemExit('Cat Name field not found')
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt'
          git diff --cached --quiet || git commit -m 'Remove redundant Choose Image button'
          git push