name: Remove Choose Image Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-post-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update post UI text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt')
          s = p.read_text()

          # Singular grammar: 0 like, 1 like, 2+ likes.
          s = s.replace('Text("${post.likeCount} likes", color = if (liked) LostRed else MaterialTheme.colorScheme.onSurfaceVariant)', 'Text(if (post.likeCount == 1) "1 like" else "${post.likeCount} likes", color = if (liked) LostRed else MaterialTheme.colorScheme.onSurfaceVariant)')

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt'
          git diff --cached --quiet || git commit -m 'Use singular like label for one like'
          git push
