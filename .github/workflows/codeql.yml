name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none

          - language: swift
            runner: macos-latest
            build-mode: autobuild

          - language: java-kotlin
            runner: ubuntu-latest
            build-mode: autobuild

          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none

          - language: csharp
            runner: ubuntu-latest
            build-mode: autobuild

          - language: python
            runner: ubuntu-latest
            build-mode: none

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare Android Firebase configuration for CodeQL
        if: matrix.language == 'java-kotlin'
        run: cp Firebase/Android/google-services.json Android/app/google-services.json

      - name: Install Oracle JDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://download.oracle.com/java/26/latest/jdk-26_linux-x64_bin.tar.gz -o /tmp/jdk-26.0.2.1.tar.gz
          sudo mkdir -p /opt/oracle
          sudo tar -xzf /tmp/jdk-26.0.2.1.tar.gz -C /opt/oracle
          JDK_DIR="$(find /opt/oracle -maxdepth 1 -type d -name 'jdk-26*' -print -quit)"
          test -n "$JDK_DIR"
          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          echo "JDK_DIR=$JDK_DIR" >> "$GITHUB_ENV"
          echo "$JDK_DIR/bin" >> "$GITHUB_PATH"
          "$JDK_DIR/bin/java" -version

      - name: Register Oracle JDK 26.0.2.1 for CodeQL toolchain selection
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /home/runner/.m2
          sudo tee /home/runner/.m2/toolchains.xml >/dev/null <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>26</version>
                <vendor>Oracle</vendor>
              </provides>
              <configuration>
                <jdkHome>${JDK_DIR}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Verify Oracle JDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        run: |
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | grep -q '26.0.2.1'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild compiled languages
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:${{ matrix.language }}
