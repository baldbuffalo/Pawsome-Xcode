name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none

          - language: swift
            runner: macos-26-intel
            build-mode: autobuild

          - language: java-kotlin
            runner: ubuntu-latest
            build-mode: autobuild

          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none

          - language: csharp
            runner: windows-latest
            build-mode: autobuild

          - language: python
            runner: ubuntu-latest
            build-mode: none

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare Android Firebase configuration for CodeQL
        if: matrix.language == 'java-kotlin'
        run: cp Firebase/Android/google-services.json Android/app/google-services.json

      - name: Install Eclipse Temurin OpenJDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          JDK_VERSION='26.0.2.1'
          JDK_TAG='jdk-26.0.2.1+1'
          JDK_ARCHIVE="OpenJDK26U-jdk_x64_linux_hotspot_${JDK_VERSION}_1.tar.gz"
          JDK_URL="https://github.com/adoptium/temurin26-binaries/releases/download/${JDK_TAG//+/%2B}/${JDK_ARCHIVE}"
          JDK_DIR="/opt/temurin-${JDK_VERSION}"

          curl -fL --retry 5 --retry-delay 2 "$JDK_URL" -o /tmp/temurin-jdk.tar.gz
          sudo rm -rf "$JDK_DIR"
          sudo mkdir -p "$JDK_DIR"
          sudo tar -xzf /tmp/temurin-jdk.tar.gz --strip-components=1 -C "$JDK_DIR"

          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          echo "$JDK_DIR/bin" >> "$GITHUB_PATH"

          "$JDK_DIR/bin/java" -version

      - name: Verify Eclipse Temurin OpenJDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        run: |
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | grep -q '26.0.2.1'

      - name: Register Temurin JDK 26 for CodeQL toolchain selection
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>26</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Prepare Swift build environment
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcrun --find swiftc
          xcrun --find xcodebuild

      - name: Autobuild compiled languages
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:${{ matrix.language }}
