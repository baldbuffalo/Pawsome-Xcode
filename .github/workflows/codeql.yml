name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none

          - language: swift
            runner: macos-26-intel
            build-mode: manual

          - language: java-kotlin
            runner: ubuntu-latest
            build-mode: autobuild

          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none

          - language: csharp
            runner: windows-latest
            build-mode: autobuild

          - language: python
            runner: ubuntu-latest
            build-mode: none

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android Firebase configuration for CodeQL
        if: matrix.language == 'java-kotlin'
        run: cp Firebase/Android/google-services.json Android/app/google-services.json

      - name: Install Eclipse Temurin OpenJDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          JDK_VERSION='26.0.2.1'
          JDK_TAG='jdk-26.0.2.1+1'
          JDK_ARCHIVE="OpenJDK26U-jdk_x64_linux_hotspot_${JDK_VERSION}_1.tar.gz"
          JDK_URL="https://github.com/adoptium/temurin26-binaries/releases/download/${JDK_TAG//+/%2B}/${JDK_ARCHIVE}"
          JDK_DIR="/opt/temurin-${JDK_VERSION}"

          curl -fL --retry 5 --retry-delay 2 "$JDK_URL" -o /tmp/temurin-jdk.tar.gz
          sudo rm -rf "$JDK_DIR"
          sudo mkdir -p "$JDK_DIR"
          sudo tar -xzf /tmp/temurin-jdk.tar.gz --strip-components=1 -C "$JDK_DIR"

          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          echo "$JDK_DIR/bin" >> "$GITHUB_PATH"
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JDK_DIR" >> "$GITHUB_ENV"

          "$JDK_DIR/bin/java" -version

      - name: Install Gradle 9.7.1
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION='9.7.1'
          GRADLE_ARCHIVE="gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_URL="https://services.gradle.org/distributions/${GRADLE_ARCHIVE}"
          GRADLE_DIR="/opt/gradle-${GRADLE_VERSION}"

          curl -fL --retry 5 --retry-delay 2 "$GRADLE_URL" -o /tmp/gradle.zip
          sudo rm -rf "$GRADLE_DIR"
          sudo mkdir -p "$GRADLE_DIR"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Verify Eclipse Temurin OpenJDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        run: |
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          echo "GRADLE_OPTS=$GRADLE_OPTS"
          java -version 2>&1 | grep -q '26.0.2.1'

      - name: Verify Gradle 9.7.1 uses Temurin JDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        run: |
          gradle --version
          gradle --version 2>&1 | grep -q 'Gradle 9.7.1'
          gradle --version 2>&1 | grep -q '26.0.2.1'

      - name: Register Temurin JDK 26 for CodeQL toolchain selection
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>26</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Verify Swift Intel CodeQL environment
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          echo "Swift:"
          swift --version
          echo "Xcode:"
          xcodebuild -version
          echo "swiftc:"
          xcrun --find swiftc
          echo "xcodebuild:"
          xcrun --find xcodebuild

      - name: Resolve Swift package dependencies
        if: matrix.language == 'swift'
        working-directory: iOS
        run: xcodebuild -project Pawsome.xcodeproj -scheme Pawsome -resolvePackageDependencies

      - name: Clean Swift build products
        if: matrix.language == 'swift'
        working-directory: iOS
        run: xcodebuild -project Pawsome.xcodeproj -scheme Pawsome -configuration Debug clean

      - name: Build Swift for CodeQL
        if: matrix.language == 'swift'
        working-directory: iOS
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Pawsome.xcodeproj \
            -scheme Pawsome \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Pawsome-CodeQL-DerivedData" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Autobuild compiled languages
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4.38.0

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: /language:${{ matrix.language }}
