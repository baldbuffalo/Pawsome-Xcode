name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none

          - language: swift
            runner: macos-latest
            build-mode: autobuild

          - language: java-kotlin
            runner: ubuntu-latest
            build-mode: autobuild

          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none

          - language: csharp
            runner: ubuntu-latest
            build-mode: autobuild

          - language: python
            runner: ubuntu-latest
            build-mode: none

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare Android Firebase configuration for CodeQL
        if: matrix.language == 'java-kotlin'
        run: cp Firebase/Android/google-services.json Android/app/google-services.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild compiled languages
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:${{ matrix.language }}
