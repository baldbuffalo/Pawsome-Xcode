name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none

          - language: swift
            runner: macos-latest
            build-mode: autobuild

          - language: java-kotlin
            runner: ubuntu-latest
            build-mode: autobuild

          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none

          - language: csharp
            runner: ubuntu-latest
            build-mode: autobuild

          - language: python
            runner: ubuntu-latest
            build-mode: none

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare Android Firebase configuration for CodeQL
        if: matrix.language == 'java-kotlin'
        run: cp Firebase/Android/google-services.json Android/app/google-services.json

      - name: Set up Eclipse Temurin JDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '26.0.2.1'
          check-latest: true

      - name: Verify Eclipse Temurin JDK 26.0.2.1
        if: matrix.language == 'java-kotlin'
        run: |
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | grep -q '26.0.2.1'

      - name: Register Temurin JDK 26 for CodeQL toolchain selection
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>26</version>
                <vendor>Temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild compiled languages
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:${{ matrix.language }}
