name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-app:
    name: Android app build (Jetpack Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.7.1'
      - name: Setup Firebase configuration
        run: cp ../Firebase/Android/google-services.json app/google-services.json
      - name: Build APK
        env:
          ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_WEB_CLIENT_ID }}
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          PAWSOME_IMAGE_UPLOAD_TOKEN: ${{ secrets.PAWSOME_IMAGE_UPLOAD_TOKEN }}
        run: |
          echo "GITHUB_TOKEN=$PAWSOME_IMAGE_UPLOAD_TOKEN" >> gradle.properties
          echo "TWITTER_CONSUMER_KEY=$TWITTER_CONSUMER_KEY" >> gradle.properties
          echo "TWITTER_CONSUMER_SECRET=$TWITTER_CONSUMER_SECRET" >> gradle.properties
          gradle assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pawsome-Android
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Update latest release APK when changed
    runs-on: ubuntu-latest
    needs: android-app
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          name: Pawsome-Android
          path: android
      - name: Check APK against latest release
        id: apk-check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK_FILE=$(find android -type f -name '*.apk' -print -quit)
          test -n "$APK_FILE"

          mkdir -p existing
          if gh release download latest --repo "$GH_REPO" --pattern '*.apk' --dir existing --clobber; then
            EXISTING_APK=$(find existing -type f -name '*.apk' -print -quit || true)
          else
            EXISTING_APK=""
          fi

          NEW_SHA=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          if [ -n "$EXISTING_APK" ]; then
            OLD_SHA=$(sha256sum "$EXISTING_APK" | cut -d' ' -f1)
          else
            OLD_SHA=""
          fi

          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "APK is identical to the latest release APK. No replacement needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "APK differs from the latest release APK. Release asset will be replaced."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Replace APK in latest release
        if: steps.apk-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK_FILE=$(find android -type f -name '*.apk' -print -quit)
          test -n "$APK_FILE"
          gh release upload latest "$APK_FILE" --repo "$GH_REPO" --clobber
      - name: Keep existing release APK
        if: steps.apk-check.outputs.changed == 'false'
        run: echo "Latest release APK is already identical; leaving release untouched."
