name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Core engine build & tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pawsome-Windows
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '8.0.x'
      - name: Test Pawsome.Core
        run: dotnet test Pawsome.Core.Tests/Pawsome.Core.Tests.csproj -c Release

  windows-app:
    name: Windows app build (WinUI 3)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Pawsome-Windows
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '8.0.x'
      - name: Publish Pawsome.exe (single self-contained file)
        run: dotnet publish Pawsome.App/Pawsome.App.csproj -c Release -r win-x64 --self-contained -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded -p:EnableWindowsTargeting=true -p:GoogleClientId=${{ secrets.WINDOWS_GOOGLE_CLIENT_ID }} -p:GoogleClientSecret=${{ secrets.WINDOWS_GOOGLE_CLIENT_SECRET }} -p:TwitterConsumerKey=${{ secrets.TWITTER_CONSUMER_KEY }} -p:TwitterConsumerSecret=${{ secrets.TWITTER_CONSUMER_SECRET }}
      - name: Upload Windows build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pawsome-Windows-x64
          path: Pawsome-Windows/Pawsome.App/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/Pawsome.exe
          if-no-files-found: error

  ios-app:
    name: iOS app build (SwiftUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Update Swift packages to latest eligible releases
        working-directory: iOS
        run: |
          rm -f Pawsome.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -project Pawsome.xcodeproj
      - name: Setup Secrets
        working-directory: iOS/Pawsome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SIGN_IN_IOS_CLIENT_ID: ${{ secrets.GOOGLE_SIGN_IN_IOS_CLIENT_ID }}
        run: |
          mkdir -p ../Pawsome.xcodeproj/xcshareddata/xcschemes
          GOOGLE_SIGN_IN_IOS_REVERSED_CLIENT_ID="com.googleusercontent.apps.${GOOGLE_SIGN_IN_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          cat > Secrets.xcconfig << EOF
          GITHUB_TOKEN = $GITHUB_TOKEN
          GOOGLE_SIGN_IN_IOS_CLIENT_ID = $GOOGLE_SIGN_IN_IOS_CLIENT_ID
          GOOGLE_SIGN_IN_IOS_REVERSED_CLIENT_ID = $GOOGLE_SIGN_IN_IOS_REVERSED_CLIENT_ID
          EOF
      - name: Build iOS app (Physical Device)
        run: |
          xcodebuild -project iOS/Pawsome.xcodeproj \
            -scheme Pawsome \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-build-log
          path: ~/Library/Logs/DiagnosticReports/*.plist
          if-no-files-found: ignore

  android-app:
    name: Android app build (Jetpack Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.7.1'
      - name: Setup Firebase configuration
        run: cp ../Firebase/Android/google-services.json app/google-services.json
      - name: Build APK
        env:
          ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_WEB_CLIENT_ID }}
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          PAWSOME_IMAGE_UPLOAD_TOKEN: ${{ secrets.PAWSOME_IMAGE_UPLOAD_TOKEN }}
        run: |
          echo "GITHUB_TOKEN=$PAWSOME_IMAGE_UPLOAD_TOKEN" >> gradle.properties
          echo "TWITTER_CONSUMER_KEY=$TWITTER_CONSUMER_KEY" >> gradle.properties
          echo "TWITTER_CONSUMER_SECRET=$TWITTER_CONSUMER_SECRET" >> gradle.properties
          gradle assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pawsome-Android
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Update latest release APK
    runs-on: ubuntu-latest
    needs: [core, windows-app, ios-app, android-app]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          name: Pawsome-Android
          path: android
      - name: Replace APK in latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK_FILE=$(find android -type f -name '*.apk' -print -quit)
          test -n "$APK_FILE"
          gh release upload latest "$APK_FILE" --clobber