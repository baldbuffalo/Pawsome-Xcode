name: Apple Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks

      - name: Prepare iOS build configuration
        env:
          PAWSOME_ASSETS_TOKEN: ${{ secrets.PAWSOME_ASSETS_TOKEN }}
        run: |
          set -euo pipefail

          # The project references this ignored local config file.
          GOOGLE_PLIST="Firebase/iOS/GoogleService-Info.plist"
          test -f "$GOOGLE_PLIST"

          GOOGLE_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :CLIENT_ID' "$GOOGLE_PLIST")
          GOOGLE_REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$GOOGLE_PLIST")

          cat > iOS/Pawsome/Secrets.xcconfig <<EOF
          GITHUB_TOKEN = ${PAWSOME_ASSETS_TOKEN:-UNCONFIGURED}
          GOOGLE_SIGN_IN_IOS_CLIENT_ID = $GOOGLE_CLIENT_ID
          GOOGLE_SIGN_IN_IOS_REVERSED_CLIENT_ID = $GOOGLE_REVERSED_CLIENT_ID
          EOF
          chmod 600 iOS/Pawsome/Secrets.xcconfig

          # FirebaseApp.configure() loads this file from the app bundle.
          cp "$GOOGLE_PLIST" iOS/Pawsome/GoogleService-Info.plist

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project iOS/Pawsome.xcodeproj \
            -scheme Pawsome \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/PawsomeSourcePackages"

      - name: Build iOS app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project iOS/Pawsome.xcodeproj \
            -scheme Pawsome \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PawsomeDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/PawsomeSourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PawsomeDerivedData/Build/Products/Release-iphoneos/Pawsome.app"
          test -d "$APP" || {
            echo "Pawsome.app was not produced by the iOS build."
            find "$RUNNER_TEMP/PawsomeDerivedData/Build/Products" -maxdepth 3 -name '*.app' -print || true
            exit 1
          }

          # Some Xcode project configurations omit CFBundleVersion from the
          # generated Info.plist. InstallOnAir and other IPA processors expect it.
          INFO_PLIST="$APP/Info.plist"
          test -f "$INFO_PLIST"
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST" >/dev/null 2>&1; then
            BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
            if [ -z "$BUILD_VERSION" ]; then
              /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1' "$INFO_PLIST"
            fi
          else
            /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$INFO_PLIST"
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST"
          plutil -lint "$INFO_PLIST"

          STAGING="$RUNNER_TEMP/ipa-staging"
          mkdir -p "$STAGING/Payload"
          ditto "$APP" "$STAGING/Payload/Pawsome.app"
          ditto -c -k --sequesterRsrc --keepParent "$STAGING/Payload" "$RUNNER_TEMP/Pawsome-unsigned.ipa"

          test -s "$RUNNER_TEMP/Pawsome-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/Pawsome-unsigned.ipa" | grep -q 'Payload/Pawsome.app/'
          echo "ipa_path=$RUNNER_TEMP/Pawsome-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pawsome-unsigned-IPA
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Add IPA to the latest GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$IPA_PATH" --clobber
            echo "Uploaded Pawsome-unsigned.ipa to the latest release."
          else
            echo "No release tagged 'latest' exists; the IPA is still available in the workflow artifacts."
          fi

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Pawsome iOS build"
            echo
            echo "- Build type: unsigned IPA"
            echo "- Apple Developer membership: not required to compile/package"
            echo "- Direct iPhone installation: requires signing; this file is not App Store- or TestFlight-installable"
            echo "- Workflow artifact: Pawsome-unsigned-IPA"
          } >> "$GITHUB_STEP_SUMMARY"
