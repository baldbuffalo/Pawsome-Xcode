name: Fix Chat System Message
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply robust chat patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Firestore.kt
          p=Path('Firebase/Android/Firestore.kt'); s=p.read_text()
          if 'val type: String = "user"' not in s:
              s=s.replace('val text: String,\n    val timestampMillis: Long,\n)', 'val text: String,\n    val timestampMillis: Long,\n    val type: String = "user",\n    val recipientUid: String? = null,\n)')
          s=s.replace('lastMessage = d.getString("lastMessage") ?: "",\n                updatedAtMillis = d.getTimestamp("updatedAt")?.toDate()?.time ?: 0L,', 'lastMessage = d.getString("${uid}_lastMessage") ?: d.getString("lastMessage") ?: "",\n                updatedAtMillis = d.getTimestamp("${uid}_updatedAt")?.toDate()?.time\n                    ?: d.getTimestamp("updatedAt")?.toDate()?.time ?: 0L,')
          if '"${uid}_lastMessage" to ""' not in s:
              s=s.replace('"lastMessage" to "",\n                "updatedAt" to FieldValue.serverTimestamp(),', '"lastMessage" to "",\n                "updatedAt" to FieldValue.serverTimestamp(),\n                "${uid}_lastMessage" to "",\n                "${uid}_updatedAt" to FieldValue.serverTimestamp(),\n                "${otherUid}_lastMessage" to "",\n                "${otherUid}_updatedAt" to FieldValue.serverTimestamp(),')
          s=s.replace('fun observeMessages(chatId: String, onChanged: (List<ChatMessage>) -> Unit, onError: (Exception) -> Unit): ListenerRegistration {', 'fun observeMessages(chatId: String, viewerUid: String, onChanged: (List<ChatMessage>) -> Unit, onError: (Exception) -> Unit): ListenerRegistration {')
          s=re.sub(r'                onChanged\(snapshot\?\.documents\?\.map(?:NotNull)? \{ d ->.*?                \} \?: emptyList\(\)\)\n', '''                onChanged(snapshot?.documents?.mapNotNull { d ->
                    val recipientUid = d.getString("recipientUid")
                    if (recipientUid != null && recipientUid != viewerUid) return@mapNotNull null
                    ChatMessage(
                        id = d.id,
                        senderUid = d.getString("senderUid") ?: "",
                        text = d.getString("text") ?: "",
                        timestampMillis = d.getTimestamp("timestamp")?.toDate()?.time ?: 0L,
                        type = d.getString("type") ?: "user",
                        recipientUid = recipientUid,
                    )
                } ?: emptyList())
''', s, count=1, flags=re.S)
          # Replace sendMessage body regardless of whether the first migration already ran.
          s=re.sub(r'    suspend fun sendMessage\(chatId: String, senderUid: String, text: String\).*?\n    suspend fun createPossibleMatchNotification', '''    suspend fun sendMessage(chatId: String, senderUid: String, text: String) = withContext(Dispatchers.IO) {
        val chat = db.collection("chats").document(chatId)
        val message = chat.collection("messages").document()
        val existing = chat.get().await()
        val participants = existing.get("participants") as? List<*> ?: emptyList<Any?>()
        db.runTransaction { transaction ->
            transaction.set(message, mapOf(
                "senderUid" to senderUid,
                "type" to "user",
                "text" to text,
                "timestamp" to FieldValue.serverTimestamp(),
            ))
            transaction.set(chat, mapOf(
                "lastMessage" to text,
                "updatedAt" to FieldValue.serverTimestamp(),
                "${senderUid}_lastMessage" to text,
                "${senderUid}_updatedAt" to FieldValue.serverTimestamp(),
            ), SetOptions.merge())
            participants.filterIsInstance<String>().filter { it != senderUid }.forEach { recipient ->
                transaction.set(chat, mapOf(
                    "${recipient}_lastMessage" to text,
                    "${recipient}_updatedAt" to FieldValue.serverTimestamp(),
                ), SetOptions.merge())
            }
        }.await()
    }

    suspend fun createPossibleMatchNotification''', s, count=1, flags=re.S)
          # Replace the match function.
          s=re.sub(r'    suspend fun createPossibleMatchNotification\(foundPostId: String, lostPost: Post, finderUid: String\).*?\n    suspend fun fetchOrCreateUser', '''    suspend fun createPossibleMatchNotification(foundPostId: String, lostPost: Post, finderUid: String): String = withContext(Dispatchers.IO) {
        val owner = findUserByUserNumber(lostPost.userId) ?: throw FirestoreException("Could not find the Lost Cat owner")
        val chatId = createOrGetConversation(owner.uid, finderUid, "Pawsome user", owner.username)
        val systemText = "🐾 Possible match: someone found a cat that may be ${lostPost.catName}. Check the Found Cat post and contact the finder if you think it is your cat."
        val chat = db.collection("chats").document(chatId)
        val message = chat.collection("messages").document()
        db.runTransaction { transaction ->
            transaction.set(message, mapOf(
                "senderUid" to "system",
                "recipientUid" to owner.uid,
                "type" to "system",
                "text" to systemText,
                "foundPostId" to foundPostId,
                "lostPostId" to lostPost.id,
                "timestamp" to FieldValue.serverTimestamp(),
            ))
            transaction.set(chat, mapOf(
                "${owner.uid}_lastMessage" to systemText,
                "${owner.uid}_updatedAt" to FieldValue.serverTimestamp(),
            ), SetOptions.merge())
        }.await()
        db.collection("notifications").document().set(mapOf(
            "recipientUid" to owner.uid,
            "senderUid" to finderUid,
            "type" to "chat_system_message",
            "chatId" to chatId,
            "foundPostId" to foundPostId,
            "lostPostId" to lostPost.id,
            "catName" to lostPost.catName,
            "text" to systemText,
            "createdAt" to FieldValue.serverTimestamp(),
            "read" to false,
        )).await()
        chatId
    }

    fun observeChatNotifications(uid: String, onNotification: (String, String, String, String) -> Unit, onError: (Exception) -> Unit): ListenerRegistration {
        return db.collection("notifications").whereEqualTo("recipientUid", uid).whereEqualTo("read", false)
            .addSnapshotListener { snapshot, error ->
                if (error != null) { onError(error); return@addSnapshotListener }
                snapshot?.documents?.forEach { d ->
                    if (d.getString("type") != "chat_system_message") return@forEach
                    val text = d.getString("text") ?: return@forEach
                    val chatId = d.getString("chatId") ?: return@forEach
                    val senderUid = d.getString("senderUid") ?: ""
                    val other = "Pawsome user"
                    onNotification(text, chatId, senderUid, other)
                    d.reference.update("read", true)
                }
            }
    }

    suspend fun fetchOrCreateUser''', s, count=1, flags=re.S)
          p.write_text(s)

          # AppViewModel.kt
          p=Path('Android/app/src/main/java/com/pawsome/app/ui/AppViewModel.kt'); s=p.read_text()
          if 'import android.os.Build' not in s:
              s=s.replace('import android.net.Uri\n', 'import android.net.Uri\nimport android.os.Build\n')
          if 'notificationListener: ListenerRegistration?' not in s:
              s=s.replace('private var messagesListener: ListenerRegistration? = null', 'private var messagesListener: ListenerRegistration? = null\n    private var notificationListener: ListenerRegistration? = null')
          s=s.replace('messagesListener?.remove(); messagesListener = null', 'messagesListener?.remove(); messagesListener = null\n        notificationListener?.remove(); notificationListener = null')
          s=s.replace('messagesListener = firestore.observeMessages(id, { activeMessages = it }, { e -> error = e.message })', 'messagesListener = firestore.observeMessages(id, uid ?: return, { activeMessages = it }, { e -> error = e.message })')
          s=s.replace('userListener?.remove(); messagesListener?.remove()\n', 'userListener?.remove(); messagesListener?.remove(); notificationListener?.remove()\n')
          if 'fun startChatNotificationListener()' not in s:
              s=s.replace('fun sendMessage(text: String) = viewModelScope.launch {', '''fun startChatNotificationListener() {
        notificationListener?.remove()
        val u = uid ?: return
        notificationListener = firestore.observeChatNotifications(u, { text, chatId, otherUid, otherName ->
            showChatNotification(text, chatId)
        }, { e -> error = e.message })
    }

    private fun showChatNotification(text: String, chatId: String) {
        if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(app, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return
        val notification = NotificationCompat.Builder(app, "pawsome_chat")
            .setSmallIcon(android.R.drawable.ic_dialog_info)
            .setContentTitle("Pawsome chat")
            .setContentText(text)
            .setStyle(NotificationCompat.BigTextStyle().bigText(text))
            .setAutoCancel(true)
            .setPriority(NotificationCompat.PRIORITY_HIGH)
            .build()
        NotificationManagerCompat.from(app).notify(chatId.hashCode() and 0x7fffffff, notification)
    }

    fun sendMessage(text: String) = viewModelScope.launch {''')
          if 'startChatNotificationListener()' not in s.split('fun startChatNotificationListener()',1)[0]:
              s=s.replace('loadConversations()\n                    true', 'loadConversations()\n                    startChatNotificationListener()\n                    true')
          p.write_text(s)

          # ChatScreens.kt
          p=Path('Android/app/src/main/java/com/pawsome/app/ui/ChatScreens.kt'); s=p.read_text()
          if 'if (item.type == "system")' not in s:
              old='''                val mine = item.senderUid == vm.uid
                Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), horizontalArrangement = if (mine) Arrangement.End else Arrangement.Start) {
                    Surface(shape = RoundedCornerShape(18.dp), color = if (mine) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant) {
                        Text(item.text, modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp), color = MaterialTheme.colorScheme.onSurface)
                    }
                }'''
              new='''                if (item.type == "system") {
                    Row(Modifier.fillMaxWidth().padding(vertical = 8.dp), horizontalArrangement = Arrangement.Center) {
                        Surface(shape = RoundedCornerShape(14.dp), color = MaterialTheme.colorScheme.secondaryContainer) {
                            Column(Modifier.padding(horizontal = 14.dp, vertical = 10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                Text("Pawsome", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = MaterialTheme.colorScheme.primary)
                                Text(item.text, color = MaterialTheme.colorScheme.onSecondaryContainer, fontSize = 13.sp)
                            }
                        }
                    }
                } else {
                    val mine = item.senderUid == vm.uid
                    Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), horizontalArrangement = if (mine) Arrangement.End else Arrangement.Start) {
                        Surface(shape = RoundedCornerShape(18.dp), color = if (mine) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant) {
                            Text(item.text, modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp), color = MaterialTheme.colorScheme.onSurface)
                        }
                    }
                }'''
              if old in s: s=s.replace(old,new)
          p.write_text(s)

          # Manifest
          p=Path('Android/app/src/main/AndroidManifest.xml'); s=p.read_text()
          if 'POST_NOTIFICATIONS' not in s: s=s.replace('    <uses-permission android:name="android.permission.INTERNET" />','    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />')
          p.write_text(s)

          # MainActivity
          p=Path('Android/app/src/main/java/com/pawsome/app/MainActivity.kt'); s=p.read_text()
          if 'NotificationChannel' not in s:
              s=s.replace('import android.content.Intent\nimport android.os.Bundle\n', 'import android.Manifest\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.content.Intent\nimport android.content.pm.PackageManager\nimport android.os.Build\nimport android.os.Bundle\n')
              s=s.replace('import androidx.activity.ComponentActivity\n', 'import androidx.activity.ComponentActivity\nimport androidx.core.app.ActivityCompat\n')
              s=s.replace('super.onCreate(savedInstanceState)\n        setContent', '''super.onCreate(savedInstanceState)
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            getSystemService(NotificationManager::class.java).createNotificationChannel(
                NotificationChannel("pawsome_chat", "Pawsome Chat", NotificationManager.IMPORTANCE_HIGH)
            )
        }
        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
            ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 7001)
        }
        setContent''')
          p.write_text(s)
          PY
      - name: Check and commit
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Firebase/Android/Firestore.kt Android/app/src/main/java/com/pawsome/app/ui/AppViewModel.kt Android/app/src/main/java/com/pawsome/app/ui/ChatScreens.kt Android/app/src/main/AndroidManifest.xml Android/app/src/main/java/com/pawsome/app/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix private chat system message notifications'
          git push
          rm -f .github/workflows/fix-chat-system-message.yml .github/workflows/implement-chat-system-message.yml
          git add .github/workflows/fix-chat-system-message.yml .github/workflows/implement-chat-system-message.yml
          git diff --cached --quiet || git commit -m 'Remove one-time chat patch workflows'
          git push
