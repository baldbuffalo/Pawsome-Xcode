name: Apple IPA Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  xcode-cloud:
    name: Wait for Xcode Cloud iOS/macOS
    runs-on: ubuntu-latest
    outputs:
      ios_status: ${{ steps.ios.outputs.status }}
      macos_status: ${{ steps.macos.outputs.status }}
    steps:
      - name: Wait for Xcode Cloud iOS
        id: ios
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then SHA="${{ github.event.pull_request.head.sha }}"; else SHA="$GITHUB_SHA"; fi
          NAME='Pawsome | Default | Archive - iOS'
          while true; do
            CHECK=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.name == "Pawsome | Default | Archive - iOS") | {status,conclusion}' | tail -n1 || true)
            if [ -n "$CHECK" ]; then
              STATUS=$(jq -r '.status' <<<"$CHECK")
              CONCLUSION=$(jq -r '.conclusion // empty' <<<"$CHECK")
              echo "$NAME: $STATUS / $CONCLUSION"
              if [ "$STATUS" = completed ]; then echo "status=$CONCLUSION" >> "$GITHUB_OUTPUT"; break; fi
            else echo "$NAME has not appeared yet."; fi
            sleep 30
          done

      - name: Wait for Xcode Cloud macOS
        id: macos
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then SHA="${{ github.event.pull_request.head.sha }}"; else SHA="$GITHUB_SHA"; fi
          NAME='Pawsome | Default | Archive - macOS'
          while true; do
            CHECK=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.name == "Pawsome | Default | Archive - macOS") | {status,conclusion}' | tail -n1 || true)
            if [ -n "$CHECK" ]; then
              STATUS=$(jq -r '.status' <<<"$CHECK")
              CONCLUSION=$(jq -r '.conclusion // empty' <<<"$CHECK")
              echo "$NAME: $STATUS / $CONCLUSION"
              if [ "$STATUS" = completed ]; then echo "status=$CONCLUSION" >> "$GITHUB_OUTPUT"; break; fi
            else echo "$NAME has not appeared yet."; fi
            sleep 30
          done

      - name: End if both archives failed
        env:
          IOS: ${{ steps.ios.outputs.status }}
          MACOS: ${{ steps.macos.outputs.status }}
        run: |
          if [ "$IOS" != success ] && [ "$MACOS" != success ]; then
            echo "Both Xcode Cloud archives failed."
            exit 1
          fi
          echo "At least one Xcode Cloud archive succeeded."

  ipa-release:
    name: Replace IPA in latest release
    runs-on: ubuntu-latest
    needs: xcode-cloud
    if: github.ref == 'refs/heads/main' && needs.xcode-cloud.outputs.ios_status == 'success'
    steps:
      - name: Download IPA from Xcode Cloud
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          XCODE_CLOUD_WORKFLOW_ID: ${{ secrets.XCODE_CLOUD_WORKFLOW_ID }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY XCODE_CLOUD_WORKFLOW_ID; do
            test -n "${!v:-}" || { echo "Missing secret: $v"; exit 1; }
          done
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > key.p8
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const b64=x=>Buffer.from(x).toString('base64').replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
          function jose(der){let p=0;if(der[p++]!==0x30)throw Error('bad DER');let l=der[p++];if(l&128){let n=l&127;l=0;while(n--)l=l*256+der[p++];}if(der[p++]!==2)throw Error('bad r');let rl=der[p++],r=der.subarray(p,p+rl);p+=rl;if(der[p++]!==2)throw Error('bad s');let sl=der[p++],s=der.subarray(p,p+sl);while(r.length>32&&r[0]===0)r=r.subarray(1);while(s.length>32&&s[0]===0)s=s.subarray(1);if(r.length<32)r=Buffer.concat([Buffer.alloc(32-r.length),r]);if(s.length<32)s=Buffer.concat([Buffer.alloc(32-s.length),s]);return Buffer.concat([r,s]);}
          const now=Math.floor(Date.now()/1000),h={alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'},p={iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+900,aud:'appstoreconnect-v1'},input=b64(JSON.stringify(h))+'.'+b64(JSON.stringify(p));
          const s=crypto.createSign('SHA256');s.update(input);s.end();fs.writeFileSync('token',input+'.'+b64(jose(s.sign(fs.readFileSync('key.p8')))));
          NODE
          TOKEN=$(cat token); API=https://api.appstoreconnect.apple.com/v1; AUTH=(-H "Authorization: Bearer $TOKEN" -H 'Accept: application/json')
          if [ "${{ github.event_name }}" = "pull_request" ]; then SHA="${{ github.event.pull_request.head.sha }}"; else SHA="$GITHUB_SHA"; fi
          RUN=''
          for i in $(seq 1 40); do
            DATA=$(curl -fsSL "${AUTH[@]}" "$API/ciWorkflows/$XCODE_CLOUD_WORKFLOW_ID/buildRuns?limit=200&sort=-number&fields[ciBuildRuns]=number,sourceCommit,completionStatus")
            RUN=$(jq -r --arg sha "$SHA" '.data[] | select(.attributes.sourceCommit.commitSha==$sha) | .id' <<<"$DATA" | head -n1)
            [ -n "$RUN" ] && [ "$RUN" != null ] && break
            echo "Waiting for Xcode Cloud build run to appear in App Store Connect..."; sleep 30
          done
          test -n "$RUN" && [ "$RUN" != null ]
          ACTIONS=$(curl -fsSL "${AUTH[@]}" "$API/ciBuildRuns/$RUN/actions?limit=200&fields[ciBuildActions]=name,actionType,completionStatus")
          ACTION=$(jq -r '.data[] | select(.attributes.name=="Archive - iOS") | .id' <<<"$ACTIONS" | head -n1)
          test -n "$ACTION" && [ "$ACTION" != null ]
          ARTS=$(curl -fsSL "${AUTH[@]}" "$API/ciBuildActions/$ACTION/artifacts?limit=200&fields[ciArtifacts]=fileName,downloadUrl")
          URL=$(jq -r '.data[] | select((.attributes.fileName//"")|endswith(".ipa")) | .attributes.downloadUrl' <<<"$ARTS" | head -n1)
          test -n "$URL" && [ "$URL" != null ]
          mkdir -p ipa
          curl -fL "$URL" -o ipa/Pawsome.ipa
          test -s ipa/Pawsome.ipa
          rm -f key.p8 token

      - name: Check IPA against latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NEW=$(sha256sum ipa/Pawsome.ipa | cut -d' ' -f1)
          mkdir -p old
          if gh release download latest --repo "$REPO" --pattern Pawsome.ipa --dir old --clobber; then OLD=$(sha256sum old/Pawsome.ipa | cut -d' ' -f1); else OLD=''; fi
          if [ "$NEW" = "$OLD" ]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Remove duplicate IPA assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view latest --repo "$REPO" --json assets --jq '.assets[].name' | while read -r asset; do
            if [[ "$asset" == *.ipa && "$asset" != Pawsome.ipa ]]; then gh release delete-asset latest "$asset" --repo "$REPO" --yes; fi
          done

      - name: Replace IPA in latest release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload latest ipa/Pawsome.ipa --repo "$REPO" --clobber

      - name: Keep existing IPA
        if: steps.check.outputs.changed == 'false'
        run: echo 'Latest release IPA is unchanged.'
