name: Fix found-cat button visibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix found-cat button
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt')
          text = path.read_text()

          old_sig = 'private fun PostCard(post: Post, uid: String?, onLike: () -> Unit, onDelete: () -> Unit, onImageClick: () -> Unit, onFoundCat: () -> Unit) {'
          new_sig = 'private fun PostCard(post: Post, uid: String?, currentUserNumber: Int?, onLike: () -> Unit, onDelete: () -> Unit, onImageClick: () -> Unit, onFoundCat: () -> Unit) {'
          if old_sig not in text:
              raise SystemExit('Expected PostCard signature not found')
          text = text.replace(old_sig, new_sig, 1)

          old_call = 'PostCard(p, vm.uid, { vm.toggleLike(p) }, { vm.deletePost(p) }, { onImageClick(p.imageUrl) }, { vm.notifyFoundLostPost(p) })'
          new_call = 'PostCard(p, vm.uid, vm.user?.userNumber, { vm.toggleLike(p) }, { vm.deletePost(p) }, { onImageClick(p.imageUrl) }, { vm.notifyFoundLostPost(p) })'
          if old_call not in text:
              raise SystemExit('Expected Feed PostCard call not found')
          text = text.replace(old_call, new_call, 1)

          old_condition = 'if (post.status == PostStatus.LOST && post.userId.toString() != uid) {'
          new_condition = 'if (post.status == PostStatus.LOST && post.userId != currentUserNumber) {'
          if old_condition not in text:
              raise SystemExit('Expected found-cat condition not found')
          text = text.replace(old_condition, new_condition, 1)

          path.write_text(text)
          PY
      - name: Commit fix and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt'
          git rm '.github/workflows/add-found-cat-button.yml'
          git commit -m 'Fix I Found This Cat button visibility'
          git push origin HEAD:main
