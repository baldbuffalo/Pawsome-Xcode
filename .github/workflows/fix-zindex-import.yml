name: Fix zIndex import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add missing zIndex import
        run: |
          FILE='Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt'
          grep -q 'import androidx.compose.ui.zIndex' "$FILE" || sed -i '/import androidx.compose.ui.window.DialogProperties/a import androidx.compose.ui.zIndex' "$FILE"
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt'
          git rm '.github/workflows/fix-zindex-import.yml'
          git commit -m 'Fix Android zIndex import'
          git push origin HEAD:main
