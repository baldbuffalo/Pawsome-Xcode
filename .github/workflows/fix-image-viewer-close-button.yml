name: Fix Image Viewer Close Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Put close button above image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt')
          s = p.read_text()
          old = 'IconButton(onClick = onDismiss, modifier = Modifier.align(Alignment.TopEnd).padding(16.dp)) { Icon(Icons.Default.Close, "Close", tint = Color.White, modifier = Modifier.size(28.dp)) }'
          new = 'IconButton(onClick = onDismiss, modifier = Modifier.align(Alignment.TopEnd).padding(16.dp).zIndex(1f)) { Icon(Icons.Default.Close, "Close", tint = Color.White, modifier = Modifier.size(28.dp)) }'
          if old not in s:
              raise SystemExit('Close button code not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Android/app/src/main/java/com/pawsome/app/ui/Display Firestore data.kt' '.github/workflows/fix-image-viewer-close-button.yml'
          git rm '.github/workflows/fix-image-viewer-close-button.yml'
          git commit -m 'Keep image viewer close button above image'
          git push
